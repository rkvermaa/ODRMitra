[project]
name = "odrmitra"
version = "0.1.0"
description = "AI-enabled Virtual Negotiation Assistant for MSME Delayed Payment Disputes"
requires-python = ">=3.12"

# Lower bounds are the versions this stack is verified against; upper bounds
# keep `uv lock` from silently resolving across a breaking release. These were
# previously open-ended, which let qdrant-client drift 1.9 -> 1.17 (dropping
# QdrantClient.search() and breaking RAG) and langchain 0.3 -> 1.2.
dependencies = [
    # Web Framework
    "fastapi>=0.129.0,<0.130.0",
    "uvicorn[standard]>=0.41.0,<0.42.0",
    "python-multipart>=0.0.22,<0.1.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.46,<2.1.0",
    "asyncpg>=0.31.0,<0.32.0",
    "alembic>=1.18.4,<2.0.0",
    # Redis
    "redis>=7.2.0,<8.0.0",
    # Configuration
    "dynaconf>=3.2.12,<4.0.0",
    # Logging
    "loguru>=0.7.3,<0.8.0",
    # Auth
    "python-jose[cryptography]>=3.5.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    # Validation
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.13.1,<3.0.0",
    # LLM - LangChain (minor releases break APIs; pin to the tested minor)
    "langchain>=1.2.10,<1.3.0",
    "langchain-openai>=1.1.10,<1.2.0",
    "langchain-community>=0.4.1,<0.5.0",
    # RAG - Qdrant + sentence-transformers
    "qdrant-client>=1.17.0,<1.18.0",
    "sentence-transformers>=5.2.3,<6.0.0",
    # Document Processing
    "llama-parse>=0.6.94,<0.7.0",
    "pypdf>=6.7.1,<7.0.0",
    "tiktoken>=0.12.0,<0.13.0",
    # Storage
    "cloudinary>=1.44.1,<2.0.0",
    # HTTP Client
    "httpx>=0.28.1,<0.29.0",
    # Utils
    "pytz>=2025.2",
    "pyyaml>=6.0.3,<7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
