# Default settings (committed to git)

[default]
app_name = "ODRMitra"
debug = false
api_prefix = "/api/v1"

# Server
host = "0.0.0.0"
port = 8000

# Database
database_pool_size = 10
database_max_overflow = 20

# Redis
redis_db = 0

# Qdrant Vector Database
qdrant_url = "http://localhost:6333"
qdrant_collection = "odrmitra_legal"

# JWT
jwt_algorithm = "HS256"
jwt_expire_minutes = 1440  # 24 hours

# LLM Configuration
# DeepSeek retired "deepseek-chat" (July 2026); the API now accepts only
# deepseek-v4-pro / deepseek-v4-flash. Flash keeps voice latency under 2s.
default_llm_provider = "deepseek"
default_llm_model = "deepseek-v4-flash"

# Embeddings — OpenRouter /embeddings API (OpenAI-compatible). Keeps the
# backend at a few hundred MB of RAM instead of ~2GB for a local model.
embedding_model = "openai/text-embedding-3-small"
embedding_dimension = 1536
openrouter_base_url = "https://openrouter.ai/api/v1"

# ODR Workflow
# Days the respondent has to file their SOD after intimation (Section 18).
# Statutory default 15; lower it to demo the ex-parte auto-advance live.
sod_response_days = 15

# Agent Configuration
max_history_messages = 20
max_history_tokens = 4000
max_rag_chunks = 5
max_tool_iterations = 5

# RBI Bank Rate for MSMED Act Section 16 interest calculation
rbi_bank_rate = 6.50  # Current RBI bank rate (%)
# MSMED interest = 3x bank rate = 19.50% p.a. compound monthly

# Baileys WhatsApp Service
baileys_service_url = "http://127.0.0.1:3001"
baileys_api_key = "baileys-secret-key"

# Logging
log_level = "INFO"
log_format = "json"

[development]
debug = true
log_level = "DEBUG"
log_format = "pretty"

[production]
debug = false
log_level = "INFO"
log_format = "json"
